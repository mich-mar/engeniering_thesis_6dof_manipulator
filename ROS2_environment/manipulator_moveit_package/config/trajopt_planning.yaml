arm_moveit_config:
  config:
    trajopt_planning.yaml:

planning_plugin: trajopt_interface/TrajOptPlanner

request_adapters: >
  default_planner_request_adapters/AddTimeOptimalParameterization
  default_planner_request_adapters/FixWorkspaceBounds
  default_planner_request_adapters/FixStartStateBounds
  default_planner_request_adapters/FixStartStateCollision
  default_planner_request_adapters/FixStartStatePathConstraints

start_state_max_bounds_error: 0.1

trajopt_param:
  improve_ratio_threshold: 0.25   # minimum ratio (true_improve/improve) to accept step
  min_trust_box_size: 1e-4        # if trust region size < this, exit and report convergence
  min_approx_improve: 1e-6        # if improvement < this, exit and report convergence
  min_approx_improve_frac: -inf   # if ratio < threshold, shrink trust region
  max_iter: 100                   # max number of iterations
  trust_shrink_ratio: 0.1         # shrink trust region by this ratio
  trust_expand_ratio: 1.5         # expand trust region by this ratio
  ctol: 1e-4                      # constraint tolerance
  max_merit_coeff_increases: 5    # max times to increase merit coefficient
  merit_coeff_increase_ratio: 10  # Penalty scaling factor
  max_time: -1                    # no time limit if negative
  merit_error_coeff: 10           # initial penalty coefficient
  trust_box_size: 1e-1            # initial trust region (component-wise)

  problem_info:
    basic_info:
      n_steps: 20                # 2 * steps_per_phase
      dt_upper_lim: 2.0          # The upper limit of 1/dt values allowed in the optimization
      dt_lower_lim: 1.0          # The lower limit of 1/dt values allowed in the optimization
      dt_fixed: true             # if true dt = 1 (fixed), it means dt = 1 at timestep = 0
      start_fixed: true          # if false, the start pose is the one given by req.start_state
      use_time: false            # use time if true, e.g. meaning x1-x0 is the velocity for example
      convex_solver: 1           # if true, then cost infos or cnt infos should have TT_USE_TIME for their term_type
                                 # 1 = AUTO_SOLVER, 2 = BMPMP, 3 = OSQP, 4 = QPOASES, 5 = GUROBI

    init_info:
      type: 3                    # 1 = STATIONARY, 2 = JOINT_INTERPOLATED, 3 = GIVEN_TRAJ
      # request.start_state should be provided for JOINT_INTERPOLATED and GIVEN_TRAJ
      dt: 0.5

  joint_pos_term_info:
    start_pos:                  # from req.start_state
      name: start_pos
      first_timestep: 10        # First time step to which the term is applied.
      last_timestep: 10         # Last time step to which the term is applied.
      # if start_fixed is true then we can set next_timestep for start_pos as it is going
      # to be ignored and only the current pose will be the constraint at timestep = 0.
      term_type: 2              # 1 = TT_COST, 2 = TT_CNT, 3 = TT_USE_TIME

    middle_pos:
      name: middle_pos
      first_timestep: 15
      last_timestep: 15
      term_type: 2

    goal_pos:
      name: goal_pos
      first_timestep: 19
      last_timestep: 19
      term_type: 2

    goal_tmp:                   # If the constraint from request does not have any name, for example when using MotionPlanning Display in Rviz,
      name: goal_tmp            # goal_tmp is assigned as the name of the constraint.
      first_timestep: 19        # In this case: start_fixed = false and start_pos should be applied at timestep 0
      last_timestep: 19         # OR: start_fixed = true and start_pos can be applied at any timestep
      term_type: 2              #  n_steps - 1
